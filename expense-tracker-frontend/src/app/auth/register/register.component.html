<div class="register-container">
  
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  
    <div class="register-card">
      
      <div class="header-section">
        <div class="logo-mark">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <h1 class="title">ExpenseTracker</h1>
        <p class="subtitle">Join 2M+ users saving money today.</p>
      </div>
  
      <form [formGroup]="userFormGroup" (ngSubmit)="submitUser()">
  
        <div class="form-group">
          <label for="name">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="text" id="name" formControlName="name" placeholder="John Doe" 
                   [class.error-border]="isFormControlError('name')"/>
          </div>
          <small class="error-msg" *ngIf="isFormControlError('name')">Name is required</small>
        </div>
  
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
            </span>
            <input type="text" id="username" formControlName="username" placeholder="johndoe_99" 
                   [class.error-border]="isFormControlError('username')"/>
          </div>
          <small class="error-msg" *ngIf="isFormControlError('username')">Username is required</small>
        </div>
  
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input type="email" id="email" formControlName="email" placeholder="john@example.com" 
                   [class.error-border]="isFormControlError('email')"/>
          </div>
          <small class="error-msg" *ngIf="isFormControlError('email')">Valid email is required</small>
        </div>
  
        <div class="form-group">
          <label for="mobileNo">Mobile Number</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </span>
            <input type="tel" id="mobileNo" formControlName="mobileNo" placeholder="+91 9090909090" 
                   [class.error-border]="isFormControlError('mobileNo')"/>
          </div>
          <small class="error-msg" *ngIf="isFormControlError('mobileNo')">Mobile number is required</small>
        </div>
  
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" formControlName="password" placeholder="Create a strong password" 
                   [class.error-border]="isFormControlError('password')"/>
          </div>
          <small class="error-msg" *ngIf="isFormControlError('password')">Password is required</small>
        </div>
  
        <button type="submit" class="submit-btn" [disabled]="userFormGroup.invalid">
          Create Account
        </button>
  
        <p class="login-link">
          Already have an account? <a href="#">Log In</a>
        </p>
  
      </form>
    </div>
  </div>
