<div class="login-container">
  
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  
    <div class="login-card">
      
      <div class="header-section">
        <div class="logo-mark">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <h1 class="title">Welcome Back</h1>
        <p class="subtitle">Login to manage your expenses</p>
      </div>
  
      <form [formGroup]="userFormGroup" (ngSubmit)="validateUser()">
  
        <div class="form-group">
          <label for="username">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="Enter your email"
              [class.error-border]="isFormControlError('email')"
            />
          </div>
          <small class="error-msg" *ngIf="isFormControlError('username')">
            Username is required
          </small>
        </div>
  
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="Enter your password"
              [class.error-border]="isFormControlError('password')"
            />
          </div>
          <small class="error-msg" *ngIf="isFormControlError('password')">
            Password is required
          </small>
        </div>
  
        <div class="forgot-password">
          <a (click)="goToForgotPassword()">Forgot password?</a>
        </div>
  
        <button type="submit" class="submit-btn" [disabled]="userFormGroup.invalid">
          Sign In
        </button>
  
        <p class="login-link">
          Don't have an account? <a href="/register">Register</a>
        </p>
  
      </form>
    </div>
  </div>
