<div class="forgot-container">
  
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  
    <div class="forgot-card">
      
      <div class="logo-mark">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </div>
      <div class="header-section">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your email and we'll send you instructions to reset your password.</p>
      </div>
  
      <form [formGroup]="forgotFormGroup" (ngSubmit)="sendResetLink()">
  
        <div class="form-group">
          <label for="email">Registered Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </span>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="john@example.com"
              [class.error-border]="isFormControlError('email')"
            />
          </div>
          <small class="error-msg" *ngIf="isFormControlError('email')">
            Valid email is required
          </small>
        </div>
  
        <button type="submit" class="submit-btn" [disabled]="forgotFormGroup.invalid">
          Send Reset Link
        </button>
  
        <div class="back-to-login">
          <a (click)="goToLogin()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to Login
          </a>
        </div>
  
      </form>
    </div>
  </div>
